<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="34" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">معماری DropAgentX — اتصال بک‌اند و فرانت‌اند</text>

  <!-- Client / User -->
  <rect x="40" y="70" width="170" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="125" y="110" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">👤 کاربر / کلاینت</text>
  <text x="125" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">تلگرام / مرورگر / موبایل</text>

  <!-- Gateway -->
  <rect x="240" y="70" width="200" height="110" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">🚪 Gateway</text>
  <text x="340" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">single entry point</text>
  <text x="340" y="150" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">/v1  /admin  /dashboard  /.well-known</text>

  <!-- Backend Box -->
  <rect x="470" y="70" width="240" height="300" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="590" y="100" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">🔧 بک‌اند (Python)</text>
  <text x="590" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#15803d" text-anchor="middle">aiogram + FastAPI + SQLite</text>
  
  <text x="490" y="148" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">هندلرها (telegram):</text>
  <text x="590" y="166" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">start, marketplace, products, wallet, tasks, ai_chat, support, admin</text>
  
  <text x="490" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">موتور AI:</text>
  <text x="590" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">hermes_engine, ai_agent, 9router, skills_builtin</text>
  
  <text x="490" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">تجارت و امنیت:</text>
  <text x="590" y="246" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">commerce, treasury, blockchain, approval, observability</text>
  
  <text x="490" y="268" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">پنل وب ادمین:</text>
  <text x="590" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">web_admin.py, app_api.py, a2a_server.py</text>

  <!-- Frontend Box -->
  <rect x="740" y="70" width="220" height="300" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="850" y="100" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#991b1b" text-anchor="middle">🎨 فرانت‌اند (HTML/CSS/JS)</text>
  <text x="850" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Three.js · PWA · RTL</text>
  
  <text x="760" y="148" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">صفحات وب:</text>
  <text x="850" y="166" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">landing.html, storefront.html</text>
  <text x="850" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">showcase3d.html, live.html</text>
  
  <text x="760" y="204" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">پنل ادمین:</text>
  <text x="850" y="222" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">admin.html, login.html, insights.html</text>
  <text x="850" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">links.html, offline.html</text>
  
  <text x="760" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155>متفرقه:</text>
  <text x="850" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569" text-anchor="middle">assets/, fonts/, vendor/, sw.js</text>

  <!-- Connections -->
  <line x1="125" y1="180" x2="240" y2="125" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="145" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a90e2" font-weight="bold">HTTPS / WSS</text>

  <line x1="340" y1="180" x2="470" y2="160" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="385" y="195" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#166534" font-weight="bold">FastAPI / aiogram</text>

  <line x1="710" y1="220" x2="740" y2="180" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="720" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#dc2626" font-weight="bold">HTML/CSS/JS</text>

  <!-- Gateway to external services -->
  <rect x="240" y="220" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="340" y="245" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">9router (Node.js) — LLM router (اختیاری)</text>
  <line x1="340" y1="180" x2="340" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowGray)"/>

  <rect x="470" y="400" width="240" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="590" y="425" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">🗄️ دیتابیس مشترک (SQLite / Postgres)</text>
  <line x1="590" y1="370" x2="590" y2="400" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="500" y="560" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">پروتکل‌ها: HTTP · WebSocket (SSE) · A2A · MCP</text>
</svg>