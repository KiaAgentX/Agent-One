services:
  dropagentx:
    build: ./backend
    container_name: dropagentx
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - PORT=${PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    init: true
    volumes:
      - dropagentx_data:/app/data
      - dropagentx_uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  dropagentx_data:
  dropagentx_uploads: